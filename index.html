<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生活漫步 Life Walk — 每周生活提案與溫馨日誌</title>
    <!-- 載入 Tailwind CSS 與 FontAwesome 圖示 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- 核心安全防護：相容版 Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f8f9f6; color: #2c3e29; }
        .linen-bg { background-color: #fdfbf7; }
        .forest-green { color: #2c5e3b; }
        .forest-bg { background-color: #2c5e3b; }
        .custom-shadow { box-shadow: 0 10px 30px -5px rgba(44, 94, 59, 0.04), 0 4px 12px -2px rgba(0, 0, 0, 0.02); }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- 載入 React 核心與 Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const DEFAULT_CATEGORIES = [
            { id: 'cat-1', name: '個人創作', color: '#6366f1', icon: 'fa-palette' },
            { id: 'cat-2', name: '身體動能', color: '#10b981', icon: 'fa-running' },
            { id: 'cat-3', name: '閱讀養分', color: '#0ea5e9', icon: 'fa-book-open' },
            { id: 'cat-4', name: '心靈綠洲', color: '#ec4899', icon: 'fa-leaf' },
            { id: 'cat-5', name: '生活微光', color: '#f59e0b', icon: 'fa-wand-magic-sparkles' }
        ];

        const INITIAL_HABITS = [
            { id: 'h-1', name: '每日創作 30 分鐘', category: 'cat-1', icon: 'fa-pen-fancy' },
            { id: 'h-2', name: '充足飲水 2000cc', category: 'cat-5', icon: 'fa-droplet' },
            { id: 'h-3', name: '核心訓練與拉筋伸展', category: 'cat-2', icon: 'fa-child-reaching' }
        ];

        const INITIAL_MOCK_DATA = {
            '2026-06-01': {
                todos: [
                    { id: 't1', text: '整理書桌並換上新盆栽', completed: true, category: 'cat-5' },
                    { id: 't2', text: '寫下 3 件今天感恩的事', completed: false, category: 'cat-4' },
                    { id: 't3', text: '繪製 2D 戰鬥場景新草稿', completed: true, category: 'cat-1' }
                ],
                habits: { 'h-1': true, 'h-2': true, 'h-3': false }, mood: '🥰', note: '整理完空間精神好多了！創作專案線稿靈感很棒。'
            },
            '2026-06-02': {
                todos: [
                    { id: 't4', text: '核心肌群訓練與有氧 30 分鐘', completed: true, category: 'cat-2' },
                    { id: 't5', text: '閱讀美學雜誌 2 章節', completed: true, category: 'cat-3' },
                    { id: 't6', text: 'Blender 骨架工具操作練習', completed: true, category: 'cat-1' }
                ],
                habits: { 'h-1': true, 'h-2': true, 'h-3': true }, mood: '😊', note: '運動完多巴胺滿滿，晚上閱讀也很有收穫！'
            },
            '2026-06-03': {
                todos: [
                    { id: 't7', text: '慢跑 5 公里流流汗', completed: true, category: 'cat-2' },
                    { id: 't8', text: '睡前深層冥想 15 分鐘', completed: true, category: 'cat-4' },
                    { id: 't9', text: '手沖精品咖啡豆風味嘗試', completed: true, category: 'cat-5' }
                ],
                habits: { 'h-1': true, 'h-2': true, 'h-3': true }, mood: '😌', note: '水洗耶加雪菲的柑橘香氣極佳，冥想也讓心思沉澱下來。'
            },
            '2026-06-04': {
                todos: [
                    { id: 't10', text: '去植物店挑選新多肉植物', completed: true, category: 'cat-5' },
                    { id: 't11', text: '室內拉伸放鬆操 20 分鐘', completed: true, category: 'cat-2' }
                ],
                habits: { 'h-1': false, 'h-2': true, 'h-3': true }, mood: '🌱', note: '買到了圓葉山烏龜！擺在窗台看著就覺得心靈被治癒了。'
            },
            '2026-06-05': {
                todos: [
                    { id: 't13', text: '慢跑放鬆 3 公里', completed: true, category: 'cat-2' },
                    { id: 't14', text: '閱讀心靈放鬆書籍 30 頁', completed: true, category: 'cat-3' },
                    { id: 't15', text: '私人創作專案上色完工', completed: true, category: 'cat-1' }
                ],
                habits: { 'h-1': true, 'h-2': true, 'h-3': true }, mood: '☀️', note: '線稿跟上色都順利推進，週末前把重要創作進度完成了！'
            },
            '2026-06-06': {
                todos: [
                    { id: 't16', text: '和好友約在溫馨咖啡廳餐敘', completed: true, category: 'cat-5' },
                    { id: 't18', text: '散步慢走 40 分鐘', completed: true, category: 'cat-2' }
                ],
                habits: { 'h-1': false, 'h-2': true, 'h-3': true }, mood: '☕', note: '聊了好多創作跟生活的新想法，非常充實的週末午後。'
            },
            '2026-06-07': {
                todos: [
                    { id: 't19', text: '寫下 5 件這週感恩的留白時光', completed: true, category: 'cat-4' },
                    { id: 't20', text: '整理下週漫步生活提案規劃', completed: true, category: 'cat-4' }
                ],
                habits: { 'h-1': true, 'h-2': true, 'h-3': false }, mood: '📝', note: '好好的留白、好好的收尾，為了新的一週充滿能量。'
            }
        };

        const MOOD_Y_MAP = { '🥰': 20, '🌟': 20, '😊': 45, '😌': 65, '🌱': 95, '☀️': 45, '☕': 75, '📝': 95, '⚪': 95 };

        function App() {
            const [activeTab, setActiveTab] = useState('journal'); 
            const [selectedDate, setSelectedDate] = useState('2026-06-01');
            const [currentWeekStart, setCurrentWeekStart] = useState(new Date('2026-06-01'));
            const [statsPeriod, setStatsPeriod] = useState('week');

            const [categories, setCategories] = useState(() => {
                const saved = localStorage.getItem('lw_categories');
                return saved ? JSON.parse(saved) : DEFAULT_CATEGORIES;
            });

            const [habits, setHabits] = useState(() => {
                const saved = localStorage.getItem('lw_habits');
                return saved ? JSON.parse(saved) : INITIAL_HABITS;
            });

            const [journalData, setJournalData] = useState(() => {
                const saved = localStorage.getItem('lw_journal_data');
                return saved ? JSON.parse(saved) : INITIAL_MOCK_DATA;
            });

            const [fbConfig, setFbConfig] = useState(() => {
                const saved = localStorage.getItem('lw_fb_config');
                return saved ? JSON.parse(saved) : { apiKey: '', projectId: '', appId: '' };
            });

            const [syncStatus, setSyncStatus] = useState('');

            useEffect(() => { localStorage.setItem('lw_categories', JSON.stringify(categories)); }, [categories]);
            useEffect(() => { localStorage.setItem('lw_journal_data', JSON.stringify(journalData)); }, [journalData]);
            useEffect(() => { localStorage.setItem('lw_habits', JSON.stringify(habits)); }, [habits]);
            useEffect(() => { localStorage.setItem('lw_fb_config', JSON.stringify(fbConfig)); }, [fbConfig]);

            const weekDays = useMemo(() => {
                const days = [];
                const start = new Date(currentWeekStart);
                const dayLabels = ['日', '一', '二', '三', '四', '五', '六'];
                for (let i = 0; i < 7; i++) {
                    const dateStr = start.toISOString().split('T')[0];
                    days.push({
                        date: dateStr,
                        dayName: '週' + dayLabels[start.getDay()],
                        shortName: dayLabels[start.getDay()],
                        dayNum: start.getDate(),
                        monthNum: start.getMonth() + 1
                    });
                    start.setDate(start.getDate() + 1);
                }
                return days;
            }, [currentWeekStart]);

            const handlePrevWeek = () => {
                const newStart = new Date(currentWeekStart);
                newStart.setDate(newStart.getDate() - 7);
                setCurrentWeekStart(newStart);
                setSelectedDate(newStart.toISOString().split('T')[0]);
            };

            const handleNextWeek = () => {
                const newStart = new Date(currentWeekStart);
                newStart.setDate(newStart.getDate() + 7);
                setCurrentWeekStart(newStart);
                setSelectedDate(newStart.toISOString().split('T')[0]);
            };

            const currentDayData = journalData[selectedDate] || { todos: [], habits: {}, mood: '⚪', note: '' };

            const habitGridData = useMemo(() => {
                return habits.map(h => {
                    const weeklyRecords = weekDays.map(day => !!journalData[day.date]?.habits?.[h.id]);
                    return { ...h, weeklyRecords, doneCount: weeklyRecords.filter(Boolean).length };
                });
            }, [habits, weekDays, journalData]);

            const statsMetrics = useMemo(() => {
                const currentMonthStr = weekDays[0].date.substring(0, 7); 
                const targetDates = statsPeriod === 'week' ? weekDays.map(d => d.date) : Object.keys(journalData).filter(d => d.startsWith(currentMonthStr));

                let totalTodos = 0, completedTodos = 0;
                let habitCheckCount = 0, habitTotalPossible = targetDates.length * habits.length;
                
                const catCounts = {};
                const moodCounts = {};
                let dominantMood = '😊';
                let maxMoodCount = 0;

                targetDates.forEach(date => {
                    const data = journalData[date];
                    if (data) {
                        if (data.todos) {
                            data.todos.forEach(t => {
                                totalTodos++;
                                if (t.completed) {
                                    completedTodos++;
                                    catCounts[t.category] = (catCounts[t.category] || 0) + 1;
                                }
                            });
                        }
                        if (data.habits) {
                            Object.values(data.habits).forEach(val => { if (val) habitCheckCount++; });
                        }
                        if (data.mood && data.mood !== '⚪') {
                            moodCounts[data.mood] = (moodCounts[data.mood] || 0) + 1;
                            if (moodCounts[data.mood] > maxMoodCount) {
                                maxMoodCount = moodCounts[data.mood];
                                dominantMood = data.mood;
                            }
                        }
                    }
                });

                let currentOffset = 0;
                const totalCompleted = completedTodos || 1;
                const pieSlices = categories.map(cat => {
                    const count = catCounts[cat.id] || 0;
                    const percentage = Math.round((count / totalCompleted) * 100);
                    const strokeLength = (count / totalCompleted) * 100;
                    const offset = currentOffset;
                    currentOffset += strokeLength;
                    return { ...cat, count, percentage, strokeLength, offset };
                });

                return { todoRate: totalTodos ? Math.round((completedTodos / totalTodos) * 100) : 0, habitRate: habitTotalPossible ? Math.round((habitCheckCount / habitTotalPossible) * 100) : 0, completedTodos, dominantMood, dominantMoodCount: maxMoodCount || 1, pieSlices, targetDates };
            }, [journalData, statsPeriod, weekDays, habits, categories]);

            const addTodo = (text, categoryId) => {
                if (!text.trim()) return;
                const newTodo = { id: 'todo-' + Date.now(), text, completed: false, category: categoryId };
                setJournalData(prev => ({ ...prev, [selectedDate]: { ...currentDayData, todos: [...(currentDayData.todos || []), newTodo] } }));
            };

            const toggleTodo = (todoId) => {
                const updatedTodos = (currentDayData.todos || []).map(t => t.id === todoId ? { ...t, completed: !t.completed } : t);
                setJournalData(prev => ({ ...prev, [selectedDate]: { ...currentDayData, todos: updatedTodos } }));
            };

            const deleteTodo = (todoId) => {
                const updatedTodos = (currentDayData.todos || []).filter(t => t.id !== todoId);
                setJournalData(prev => ({ ...prev, [selectedDate]: { ...currentDayData, todos: updatedTodos } }));
            };

            const updateMood = (mood) => { setJournalData(prev => ({ ...prev, [selectedDate]: { ...currentDayData, mood } })); };
            const updateNote = (note) => { setJournalData(prev => ({ ...prev, [selectedDate]: { ...currentDayData, note } })); };

            const handleCloudUpload = () => {
                if (!fbConfig.apiKey || !fbConfig.projectId || !fbConfig.appId) {
                    setSyncStatus('同步失敗: 請先在設定中填入完整的 Firebase 憑證欄位。');
                    return;
                }
                try {
                    setSyncStatus('正在同步備份至雲端...');
                    if (firebase.apps.length === 0) {
                        firebase.initializeApp({ apiKey: fbConfig.apiKey, authDomain: `${fbConfig.projectId}.firebaseapp.com`, projectId: fbConfig.projectId, appId: fbConfig.appId });
                    }
                    firebase.firestore().collection('users').doc('main_profile').set({ journalData, habits, categories, updatedAt: Date.now() }, { merge: true }).then(() => {
                        setSyncStatus('✨ 雲端同步上傳成功！資料已安全備份。');
                    }).catch(err => setSyncStatus('同步失敗: ' + err.message));
                } catch (err) { setSyncStatus('同步失敗: ' + err.message); }
            };

            const handleCloudDownload = () => {
                if (!fbConfig.apiKey || !fbConfig.projectId || !fbConfig.appId) {
                    setSyncStatus('下載失敗: 請先在設定中填入完整的 Firebase 憑證欄位。');
                    return;
                }
                try {
                    setSyncStatus('正在從雲端抓取最新數據...');
                    if (firebase.apps.length === 0) {
                        firebase.initializeApp({ apiKey: fbConfig.apiKey, authDomain: `${fbConfig.projectId}.firebaseapp.com`, projectId: fbConfig.projectId, appId: fbConfig.appId });
                    }
                    firebase.firestore().collection('users').doc('main_profile').get().then((docSnap) => {
                        if (docSnap.exists) {
                            const cloud = docSnap.data();
                            if (cloud.journalData) setJournalData(cloud.journalData);
                            if (cloud.habits) setHabits(cloud.habits);
                            if (cloud.categories) setCategories(cloud.categories);
                            setSyncStatus('✨ 雲端資料同步下載覆蓋完成！');
                        } else { setSyncStatus('雲端目前尚未有備份紀錄。'); }
                    }).catch(err => setSyncStatus('下載失敗: ' + err.message));
                } catch (err) { setSyncStatus('下載失敗: ' + err.message); }
            };

            return (
                <div className="min-h-screen flex flex-col pb-16">
                    {/* 頂部大氣導覽列 */}
                    <header className="bg-white border-b border-stone-200/60 sticky top-0 z-40 backdrop-blur-md shadow-sm">
                        <div className="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
                            <div className="flex items-center space-x-3">
                                <div className="forest-bg text-white p-2.5 rounded-xl shadow-md"><i className="fa-solid fa-palette text-xl"></i></div>
                                <div>
                                    <h1 className="text-xl font-bold tracking-wide forest-green">生活漫步 <span className="text-xs font-normal text-stone-400 ml-1">Life Walk</span></h1>
                                    <p className="text-xs text-stone-400">每日日誌與自我提案 • 拾起生活的儀式感</p>
                                </div>
                            </div>
                            <nav className="flex space-x-1.5 bg-stone-100 p-1 rounded-xl">
                                <button onClick={() => setActiveTab('journal')} className={`px-4 py-2 rounded-lg text-sm font-medium transition-all ${activeTab === 'journal' ? 'bg-white forest-green shadow-sm font-semibold' : 'text-stone-500 hover:text-stone-800'}`}><i className="fa-solid fa-calendar-week mr-1.5"></i>周誌計畫</button>
                                <button onClick={() => setActiveTab('habits')} className={`px-4 py-2 rounded-lg text-sm font-medium transition-all ${activeTab === 'habits' ? 'bg-white forest-green shadow-sm font-semibold' : 'text-stone-500 hover:text-stone-800'}`}><i className="fa-solid fa-circle-check mr-1.5"></i>習慣挑戰</button>
                                <button onClick={() => setActiveTab('stats')} className={`px-4 py-2 rounded-lg text-sm font-medium transition-all ${activeTab === 'stats' ? 'bg-white forest-green shadow-sm font-semibold' : 'text-stone-500 hover:text-stone-800'}`}><i className="fa-solid fa-chart-line mr-1.5"></i>生活觀察</button>
                                <button onClick={() => setActiveTab('settings')} className={`px-4 py-2 rounded-lg text-sm font-medium transition-all ${activeTab === 'settings' ? 'bg-white forest-green shadow-sm font-semibold' : 'text-stone-500 hover:text-stone-800'}`}><i className="fa-solid fa-sliders mr-1.5"></i>系統與類別</button>
                            </nav>
                        </div>
                    </header>

                    <main className="max-w-6xl mx-auto px-6 mt-6 flex-1 w-full">
                        {syncStatus && (
                            <div className="mb-5 p-3.5 bg-emerald-50 border border-emerald-100 text-emerald-800 text-xs rounded-xl flex items-center justify-between custom-shadow">
                                <span><i className="fa-solid fa-circle-info mr-2"></i>{syncStatus}</span>
                                <button onClick={() => setSyncStatus('')} className="text-emerald-400 hover:text-emerald-600"><i className="fa-solid fa-xmark"></i></button>
                            </div>
                        )}

                        {/* 周誌計畫分頁 */}
                        {activeTab === 'journal' && (
                            <div className="space-y-6">
                                <div className="bg-white rounded-2xl p-4 border border-stone-200/60 custom-shadow flex items-center justify-between">
                                    <button onClick={handlePrevWeek} className="p-2 hover:bg-stone-50 rounded-xl border border-stone-200/40 text-stone-400 hover:text-stone-700 transition-all"><i className="fa-solid fa-chevron-left"></i></button>
                                    <div className="text-center select-none">
                                        <h2 className="text-base font-bold text-stone-800">{weekDays[0]?.monthNum}月 生活漫步</h2>
                                        <p className="text-[11px] text-stone-400">{weekDays[0]?.date.substring(5)} ~ {weekDays[6]?.date.substring(5)}</p>
                                    </div>
                                    <button onClick={handleNextWeek} className="p-2 hover:bg-stone-50 rounded-xl border border-stone-200/40 text-stone-400 hover:text-stone-700 transition-all"><i className="fa-solid fa-chevron-right"></i></button>
                                </div>

                                <p className="text-xs font-semibold text-stone-500 flex items-center"><span className="w-1.5 h-3 forest-bg rounded-full mr-2"></span>本周漫步軌跡（點選一天進入深度書寫）</p>

                                <div className="grid grid-cols-7 gap-3">
                                    {weekDays.map(day => {
                                        const dayData = journalData[day.date] || { todos: [] };
                                        const isSelected = selectedDate === day.date;
                                        const doneTodos = dayData.todos?.filter(t => t.completed).length || 0;
                                        const totalTodos = dayData.todos?.length || 0;
                                        const progress = totalTodos ? Math.round((doneTodos / totalTodos) * 100) : 0;

                                        return (
                                            <div key={day.date} onClick={() => setSelectedDate(day.date)} 
                                                 className={`p-4 rounded-2xl border cursor-pointer transition-all flex flex-col justify-between h-36 ${isSelected ? 'bg-white border-emerald-600 custom-shadow ring-2 ring-emerald-600/10 scale-[1.02]' : 'bg-white border-stone-200/50 hover:shadow-sm'}`}>
                                                <div className="flex justify-between items-start">
                                                    <div>
                                                        <span className="text-[11px] block font-medium text-stone-400">{day.dayName}</span>
                                                        <span className="text-2xl font-bold mt-0.5 block">{day.dayNum}</span>
                                                    </div>
                                                    <span className="text-xl filter drop-shadow-sm">{dayData.mood || '⚪'}</span>
                                                </div>
                                                <div>
                                                    <div className="flex justify-between text-[10px] text-stone-400 mb-1 font-medium">
                                                        <span>提案: {doneTodos}/{totalTodos}</span>
                                                        <span className="forest-green font-bold">{progress}%</span>
                                                    </div>
                                                    <div className="w-full bg-stone-100 h-1 rounded-full overflow-hidden">
                                                        <div className="forest-bg h-full transition-all duration-300" style={{ width: `${progress}%` }}></div>
                                                    </div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>

                                <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                    <div className="lg:col-span-2 bg-white rounded-2xl p-6 border border-stone-200/60 custom-shadow space-y-5">
                                        <div className="flex justify-between items-center border-b border-stone-100 pb-3">
                                            <h3 className="text-sm font-bold text-stone-800 flex items-center"><i className="fa-solid fa-clipboard-list mr-2 text-emerald-600"></i>今日生活提案 / 行動靈感</h3>
                                            <div className="w-20 bg-stone-100 h-6 rounded-full flex items-center justify-center text-[11px] font-bold text-stone-600">
                                                {currentDayData.todos?.length ? Math.round((currentDayData.todos.filter(t => t.completed).length / currentDayData.todos.length) * 100) : 0}%達成
                                            </div>
                                        </div>

                                        <form onSubmit={(e) => {
                                            e.preventDefault();
                                            addTodo(e.target.todoText.value, e.target.todoCat.value);
                                            e.target.reset();
                                        }} className="flex gap-2 bg-stone-50 p-1.5 rounded-xl border border-stone-200/40">
                                            <select name="todoCat" className="bg-white text-xs font-medium rounded-lg px-2 py-1.5 focus:outline-none">
                                                {categories.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                                            </select>
                                            <input type="text" name="todoText" placeholder="新增行動提案..." className="bg-transparent flex-1 text-xs px-2 focus:outline-none" />
                                            <button type="submit" className="forest-bg text-white text-xs px-3 py-1.5 rounded-lg font-medium"><i className="fa-solid fa-plus"></i></button>
                                        </form>

                                        <div className="space-y-2 max-h-[300px] overflow-y-auto">
                                            {(!currentDayData.todos || currentDayData.todos.length === 0) ? (
                                                <div className="text-center py-12 text-stone-400 text-xs">今天暫時沒有安排計畫。</div>
                                            ) : (
                                                currentDayData.todos.map(t => {
                                                    const cat = categories.find(c => c.id === t.category) || {};
                                                    return (
                                                        <div key={t.id} className="flex items-center justify-between p-3 bg-stone-50/40 rounded-xl border border-stone-100 hover:bg-stone-50 transition-all">
                                                            <div className="flex items-center space-x-3 cursor-pointer select-none" onClick={() => toggleTodo(t.id)}>
                                                                <div className={`w-4 h-4 rounded border flex items-center justify-center ${t.completed ? 'bg-emerald-600 border-emerald-600 text-white' : 'border-stone-300 bg-white'}`}>
                                                                    {t.completed && <i className="fa-solid fa-check text-[10px]"></i>}
                                                                </div>
                                                                <span className={`text-xs ${t.completed ? 'line-through text-stone-400' : 'text-stone-700'}`}>{t.text}</span>
                                                            </div>
                                                            <span className="text-[10px] px-2.5 py-0.5 rounded-full text-white font-medium shadow-sm" style={{ backgroundColor: cat.color }}>{cat.name}</span>
                                                        </div>
                                                    );
                                                })
                                            )}
                                        </div>
                                    </div>

                                    <div className="space-y-6">
                                        <div className="bg-white rounded-2xl p-5 border border-stone-200/60 custom-shadow">
                                            <h4 className="text-xs font-bold text-stone-400 mb-3"><i className="fa-regular fa-face-smile mr-1.5"></i>今日心情基調</h4>
                                            <div className="flex justify-between p-1 bg-stone-50 rounded-xl">
                                                {['🥰', '😊', '😌', '🌱', '☀️', '☕', '📝'].map(m => (
                                                    <button key={m} onClick={() => updateMood(m)} className={`text-lg p-1.5 rounded-lg transition-all ${currentDayData.mood === m ? 'bg-white shadow scale-110' : 'opacity-40 hover:opacity-100'}`}>{m}</button>
                                                ))}
                                            </div>
                                        </div>

                                        <div className="bg-white rounded-2xl p-5 border border-stone-200/60 custom-shadow">
                                            <h4 className="text-xs font-bold text-stone-400 mb-3"><i className="fa-solid fa-signature mr-1.5"></i>今日靈感隨筆</h4>
                                            <textarea value={currentDayData.note || ''} onChange={(e) => updateNote(e.target.value)} placeholder="記錄今天值得留念的放鬆片刻..." className="w-full h-28 p-3 text-xs rounded-xl border border-stone-200/40 focus:outline-none linen-bg text-stone-700 resize-none leading-relaxed"></textarea>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* 習慣挑戰分頁 */}
                        {activeTab === 'habits' && (
                            <div className="bg-white rounded-2xl p-6 border border-stone-200/60 custom-shadow space-y-6">
                                <div className="border-b border-stone-100 pb-4">
                                    <h3 className="text-base font-bold forest-green"><i className="fa-solid fa-circle-check mr-2 text-emerald-600"></i>本周核心習慣實踐挑戰矩陣</h3>
                                </div>
                                <div className="overflow-x-auto">
                                    <table className="w-full text-left border-collapse">
                                        <thead>
                                            <tr className="border-b border-stone-100 text-stone-400 text-xs">
                                                <th className="py-3 font-semibold">核心習慣項目</th>
                                                {weekDays.map(d => (
                                                    <th key={d.date} className="py-3 font-semibold text-center text-[11px]">{d.dayName}<br/><span className="text-stone-300 font-normal">{d.dayNum}日</span></th>
                                                ))}
                                                <th className="py-3 font-semibold text-center">每週達成</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {habitGridData.map(h => (
                                                <tr key={h.id} className="border-b border-stone-50 hover:bg-stone-50/40 transition-all">
                                                    <td className="py-4 flex items-center space-x-2.5">
                                                        <div className="w-7 h-7 rounded-lg bg-stone-50 border border-stone-100 flex items-center justify-center text-stone-500 text-xs"><i className={`fa-solid ${h.icon}`}></i></div>
                                                        <span className="text-xs font-medium text-stone-700">{h.name}</span>
                                                    </td>
                                                    {weekDays.map((d, index) => {
                                                        const isChecked = h.weeklyRecords[index];
                                                        return (
                                                            <td key={d.date} className="py-4 text-center">
                                                                <button onClick={() => {
                                                                    const dayH = { ...(journalData[d.date]?.habits || {}) };
                                                                    dayH[h.id] = !dayH[h.id];
                                                                    setJournalData(prev => ({ ...prev, [d.date]: { ...(journalData[d.date] || {}), habits: dayH } }));
                                                                }} className={`w-6 h-6 rounded-full mx-auto flex items-center justify-center border transition-all ${isChecked ? 'bg-emerald-600 border-emerald-600 text-white shadow-sm' : 'border-stone-200 bg-white text-transparent'}`}>
                                                                    <i className="fa-solid fa-check text-[10px]"></i>
                                                                </button>
                                                            </td>
                                                        );
                                                    })}
                                                    <td className="py-4 text-center">
                                                        <span className="text-xs font-bold px-2.5 py-1 bg-stone-100 rounded-full text-stone-600">{h.doneCount} / 7 天</span>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {/* 生活觀察分頁 */}
                        {activeTab === 'stats' && (
                            <div className="space-y-6">
                                <div className="bg-white rounded-2xl p-6 border border-stone-200/60 custom-shadow flex flex-col md:flex-row md:justify-between md:items-center gap-4">
                                    <div>
                                        <h3 className="text-base font-bold text-stone-800 flex items-center"><i className="fa-solid fa-chart-pie mr-2 text-emerald-600"></i>生活提案觀察分析</h3>
                                        <p className="text-xs text-stone-400 mt-0.5">觀察這段時間的生活重心，適時調研生活步調</p>
                                    </div>
                                    <div className="flex bg-stone-100 p-1 rounded-xl text-xs border border-stone-200/30">
                                        <button onClick={() => setStatsPeriod('week')} className={`px-4 py-1.5 font-medium rounded-lg transition-all ${statsPeriod === 'week' ? 'bg-white font-bold forest-green shadow-sm' : 'text-stone-400'}`}>本周觀察</button>
                                        <button onClick={() => setStatsPeriod('month')} className={`px-4 py-1.5 font-medium rounded-lg transition-all ${statsPeriod === 'month' ? 'bg-white font-bold forest-green shadow-sm' : 'text-stone-400'}`}>本月觀察</button>
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-3 gap-5">
                                    <div className="bg-white p-5 rounded-2xl border border-stone-200/60 custom-shadow flex items-center space-x-4">
                                        <div className="p-3 bg-emerald-50 text-emerald-600 rounded-xl text-lg"><i className="fa-solid fa-award"></i></div>
                                        <div>
                                            <span className="text-xs text-stone-400 font-medium block">階段計畫完成率</span>
                                            <span className="text-2xl font-bold tracking-tight text-stone-800">{statsMetrics.todoRate}%</span>
                                            <span className="text-[10px] text-stone-400 block mt-0.5">累計已實踐 {statsMetrics.completedTodos} 個提案</span>
                                        </div>
                                    </div>

                                    <div className="bg-white p-5 rounded-2xl border border-stone-200/60 custom-shadow flex items-center space-x-4">
                                        <div className="p-3 bg-amber-50 text-amber-600 rounded-xl text-lg"><i className="fa-solid fa-book-bookmark"></i></div>
                                        <div>
                                            <span className="text-xs text-stone-400 font-medium block">習慣落實指數</span>
                                            <span className="text-2xl font-bold tracking-tight text-stone-800">{statsMetrics.habitRate}%</span>
                                        </div>
                                    </div>

                                    <div className="bg-white p-5 rounded-2xl border border-stone-200/60 custom-shadow flex items-center space-x-4">
                                        <div className="p-3 bg-pink-50 text-pink-500 rounded-xl text-lg"><i className="fa-regular fa-face-heart"></i></div>
                                        <div>
                                            <span className="text-xs text-stone-400 font-medium block">主導心情狀態</span>
                                            <div className="flex items-center space-x-1.5 mt-0.5">
                                                <span className="text-2xl filter drop-shadow-sm">{statsMetrics.dominantMood}</span>
                                                <span className="text-base font-bold text-stone-700">({statsMetrics.dominantMoodCount} 天)</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                                    <div className="bg-white rounded-2xl p-6 border border-stone-200/60 custom-shadow space-y-4">
                                        <h4 className="text-sm font-bold text-stone-700 flex items-center"><span className="w-1.5 h-3 bg-pink-500 rounded-full mr-2"></span>當期心情溫度計</h4>
                                        <div className="w-full pt-4">
                                            <svg viewBox="0 0 700 140" className="w-full h-36 overflow-visible">
                                                <line x1="0" y1="20" x2="700" y2="20" stroke="#f1f2f0" strokeWidth="1" />
                                                <line x1="0" y1="45" x2="700" y2="45" stroke="#f1f2f0" strokeWidth="1" />
                                                <line x1="0" y1="65" x2="700" y2="65" stroke="#f1f2f0" strokeWidth="1" />
                                                <line x1="0" y1="95" x2="700" y2="95" stroke="#f1f2f0" strokeWidth="1" />
                                                
                                                <path d={weekDays.map((d, i) => `${i===0?'M':'L'} ${50+i*100} ${MOOD_Y_MAP[journalData[d.date]?.mood || '⚪']}`).join(' ')} 
                                                      fill="none" stroke="#f43f5e" strokeWidth="2.5" strokeLinecap="round" opacity="0.6" />
                                                
                                                {weekDays.map((d, idx) => {
                                                    const mood = journalData[d.date]?.mood || '⚪';
                                                    const cx = 50 + idx * 100;
                                                    const cy = MOOD_Y_MAP[mood];
                                                    return (
                                                        <g key={d.date}>
                                                            <circle cx={cx} cy={cy} r="4" fill="#f43f5e" />
                                                            <text x={cx} y={cy - 12} textAnchor="middle" className="text-base select-none">{mood}</text>
                                                            <text x={cx} y="130" textAnchor="middle" className="text-[11px] fill-stone-400 font-medium">{d.shortName}</text>
                                                        </g>
                                                    );
                                                })}
                                            </svg>
                                        </div>
                                    </div>

                                    <div className="bg-white rounded-2xl p-6 border border-stone-200/60 custom-shadow space-y-4">
                                        <h4 className="text-sm font-bold text-stone-700 flex items-center"><span className="w-1.5 h-3 bg-emerald-500 rounded-full mr-2"></span>生活向度重心 (已達成計畫分布)</h4>
                                        <div className="flex flex-col sm:flex-row items-center justify-around gap-4 pt-2">
                                            <div className="relative w-36 h-36 flex items-center justify-center">
                                                <svg viewBox="0 0 36 36" className="w-full h-full transform -rotate-90">
                                                    <circle cx="18" cy="18" r="15.915" fill="none" stroke="#f1f2f0" strokeWidth="4" />
                                                    {statsMetrics.pieSlices.map(slice => slice.strokeLength > 0 && (
                                                        <circle key={slice.id} cx="18" cy="18" r="15.915" fill="none" stroke={slice.color} strokeWidth="4.2" strokeDasharray={`${slice.strokeLength} ${100 - slice.strokeLength}`} strokeDashoffset={100 - slice.offset} />
                                                    ))}
                                                </svg>
                                                <div className="absolute text-center">
                                                    <span className="text-2xl font-black text-stone-800 block">{statsMetrics.completedTodos}</span>
                                                    <span className="text-[9px] font-bold text-stone-400 block -mt-0.5">實踐次數</span>
                                                </div>
                                            </div>

                                            <div className="space-y-2 flex-1 max-w-[220px] w-full">
                                                {statsMetrics.pieSlices.map(slice => (
                                                    <div key={slice.id} className="flex items-center justify-between text-xs font-medium">
                                                        <div className="flex items-center space-x-2">
                                                            <span className="w-2.5 h-2.5 rounded-full block" style={{ backgroundColor: slice.color }}></span>
                                                            <span className="text-stone-600">{slice.name}</span>
                                                        </div>
                                                        <div className="space-x-3 text-stone-400">
                                                            <span>{slice.count} 次</span>
                                                            <span className="font-semibold text-stone-500">({slice.percentage}%)</span>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* 【100% 徹底修復：再也不會空白的系統設定頁】 */}
                        {activeTab === 'settings' && (
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                {/* 左側：雲端連線卡片 */}
                                <div className="bg-white rounded-2xl p-6 border border-stone-200/60 custom-shadow space-y-5">
                                    <div className="border-b border-stone-100 pb-3">
                                        <h3 className="text-base font-bold text-stone-800 flex items-center"><i className="fa-solid fa-cloud mr-2 text-emerald-600"></i>跨裝置雲端資料庫設定</h3>
                                        <p className="text-xs text-stone-400 mt-0.5">填入您自己的私有 Firebase 金鑰憑證</p>
                                    </div>
                                    <div className="space-y-3.5">
                                        <div>
                                            <label className="block text-[11px] font-semibold text-stone-500 mb-1">API Key (金鑰)</label>
                                            <input type="password" value={fbConfig.apiKey || ''} onChange={(e) => setFbConfig({...fbConfig, apiKey: e.target.value})} placeholder="AIzaSy..." className="w-full p-2.5 text-xs border border-stone-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-600/10" />
                                        </div>
                                        <div>
                                            <label className="block text-[11px] font-semibold text-stone-400 mb-1">Project ID (專案代碼)</label>
                                            <input type="text" value={fbConfig.projectId || ''} onChange={(e) => setFbConfig({...fbConfig, projectId: e.target.value})} placeholder="life-walk-xxxx" className="w-full p-2.5 text-xs border border-stone-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-600/10" />
                                        </div>
                                        <div>
                                            <label className="block text-[11px] font-semibold text-stone-400 mb-1">App ID (應用程式 ID)</label>
                                            <input type="text" value={fbConfig.appId || ''} onChange={(e) => setFbConfig({...fbConfig, appId: e.target.value})} placeholder="1:xxxx" className="w-full p-2.5 text-xs border border-stone-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-600/10" />
                                        </div>
                                        <div className="grid grid-cols-2 gap-3 pt-3">
                                            <button onClick={handleCloudUpload} className="forest-bg text-white text-xs py-3 rounded-xl font-medium shadow-sm transition-all hover:opacity-95"><i className="fa-solid fa-cloud-arrow-up mr-1.5"></i>上傳到雲端</button>
                                            <button onClick={handleCloudDownload} className="bg-stone-100 text-stone-700 text-xs py-3 rounded-xl font-medium border border-stone-200/30 transition-all hover:bg-stone-200"><i className="fa-solid fa-cloud-arrow-down mr-1.5"></i>自雲端下載</button>
                                        </div>
                                    </div>
                                </div>

                                {/* 右側：生活類別展示卡片 */}
                                <div className="bg-white rounded-2xl p-6 border border-stone-200/60 custom-shadow space-y-4">
                                    <div className="border-b border-stone-100 pb-3">
                                        <h3 className="text-base font-bold text-stone-800 flex items-center"><i className="fa-solid fa-tags mr-2 text-emerald-600"></i>生活維度色彩定義</h3>
                                        <p className="text-xs text-stone-400 mt-0.5">目前系統已定義的核心私領域活動向度</p>
                                    </div>
                                    <div className="space-y-2.5">
                                        {categories.map(cat => (
                                            <div key={cat.id} className="flex items-center justify-between p-3.5 bg-stone-50/60 rounded-xl border border-stone-100 hover:bg-stone-50 transition-all">
                                                <span className="text-xs font-semibold text-stone-700 flex items-center">
                                                    <span className="w-3 h-3 rounded-full mr-3 shadow-sm block" style={{ backgroundColor: cat.color }}></span>
                                                    <i className={`fa-solid ${cat.icon} mr-2 text-stone-400`}></i>{cat.name}
                                                </span>
                                                <span className="text-[10px] text-stone-400 bg-white px-2 py-0.5 rounded border border-stone-200/40">{cat.color}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
